<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promise</title>
</head>
<body>
    <script>
        //callback 2가지 문제 : 1/순서보장 2/예외처리
        function f1(callback){
            return new Promise((
                resolve, reject
            ) => {
                resolve();
            })
        }
        function f2(callback){
            return new Promise((
                resolve, reject
            ) => {
                reject(new Error("실패함"));
            })
        }
        const p1 = f1();
        const p2 = f2();
        console.log(p1);
        console.log(p2);
        f1()
        .then(()=> console.log("성공함"));
        f2()
        .catch(() => console.log("실패함"));

    </script>
</body>
</html>
