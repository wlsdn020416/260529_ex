<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function delay(){
            return new Promise((resorve) => setTimeout(resorve,ms));
        }
        delay(1000)
        .then(()=>{
            if(Math.random()>0.5){
                console.log("성공");
            }else{
                throw new Error("실패");
            }
        })
        .then(()=> console.log("성공"))
        .catch(() => console.log("실패"))
        .finally(()=> console.log("상관 없음"))
    </script>
</body>
</html>
