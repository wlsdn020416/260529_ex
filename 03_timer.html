<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
</head>
<body>
    <button onclick="delay()">1초</button>
    <button onclick="stopper()">멈춤</button>
    <script>
        function delay(){
            const timerId = setTimeout(() =>console.log("1초 지남") , 1000);
            console.log(timerId);
        }
        // set interval
      let counter = 0;
      const timerId2 = setInterval(() => {
        counter++;
        console.log(counter);
      }, 1000);
      document.querySelector("#stopper").addEventListener("click", () => {
        console.log(`timer ${timerId2} 정지`);
        clearTimeout(timerId2);
      });
        

        
    </script>
</body>
</html>
